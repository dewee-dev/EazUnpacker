name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '创建为草稿（不自动发布，便于先检查产物）'
        type: boolean
        default: false

# 构建只需要读权限；发布在同 Job 内，单独申请写权限
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      # 主程序是 net48，现代后端是 net8.0-windows；
      # .slnx 需要 SDK 9.0.200+，这里把 8.0 也装上保证 net8 的 targeting pack 可用
      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            9.0.x
            8.0.x

      - name: 构建主程序（net48）
        run: dotnet build Unpacker.slnx -c Release

      - name: 构建现代后端（net8.0-windows）
        run: dotnet build src/ModernWorker/ModernWorker.csproj -c Release

      # 布局以代码为准：Unpacker.exe 从 BaseDirectory/worker 和 BaseDirectory/modern 找子进程
      - name: 组装发布目录
        run: |
          $out = 'src\bin\Release\net48'
          $modern = 'src\ModernWorker\bin\Release\net8.0-windows'
          New-Item -ItemType Directory -Path "$out\modern" -Force | Out-Null
          Copy-Item "$modern\*" -Destination "$out\modern" -Recurse -Force

          foreach ($f in 'Unpacker.exe', 'worker\Unpacker.Worker.exe', 'modern\Unpacker.ModernWorker.exe') {
            if (-not (Test-Path "$out\$f")) { throw "发布目录缺少 $f" }
          }
          Get-ChildItem $out | Select-Object Name

      - name: 打包
        id: pack
        run: |
          $ver = (Select-String -Path src/Unpacker.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $name = "EazUnpacker-v$ver-net48-Release.zip"
          Compress-Archive -Path 'src\bin\Release\net48\*' -DestinationPath $name
          "version=$ver" >> $env:GITHUB_OUTPUT
          "zip=$name" >> $env:GITHUB_OUTPUT
          Get-Item $name | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
          VER: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VER}-$(date -u +%m%d)"
            # 同一天多次构建：tag 已存在就追加序号
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              n=2
              while gh release view "${TAG}-${n}" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
                n=$((n + 1))
              done
              TAG="${TAG}-${n}"
            fi
          fi

          {
            echo "自动构建产物，基于提交 \`${GITHUB_SHA::7}\`。"
            echo
            echo "解压后运行 \`Unpacker.exe\`。现代后端需要 .NET 8 Desktop Runtime，已内置在 \`modern/\` 目录。"
            echo
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            printf '| `%s` | %s |\n' "$ZIP" "$(du -h "$ZIP" | cut -f1)"
          } > notes.md

          ARGS=(--target "$GITHUB_SHA" --title "EazUnpacker ${TAG}" --notes-file notes.md)
          if [ "$DRAFT" = "true" ]; then
            ARGS+=(--draft)
          else
            ARGS+=(--latest)
          fi

          gh release create "$TAG" "${ARGS[@]}" "$ZIP"
          echo "::notice title=Release 已创建::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
