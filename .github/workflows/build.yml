name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '创建为草稿（不自动发布，便于先检查产物）'
        type: boolean
        default: false

# 构建只需要读权限；发布在同 Job 内，单独申请写权限
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      # 主程序是 net48，现代后端是 net8.0-windows；
      # .slnx 需要 SDK 9.0.200+，这里把 8.0 也装上保证 net8 的 targeting pack 可用
      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            9.0.x
            8.0.x

      - name: 构建主程序与图形前端（net48）
        run: dotnet build Unpacker.slnx -c Release

      - name: 构建现代后端（net8.0-windows）
        run: dotnet build src/ModernWorker/ModernWorker.csproj -c Release

      # 目录布局严格对齐上游发布包（EazUnpacker-v1.0.1-net48-Release.zip），额外多一个图形前端：
      #   顶层文件夹 / Unpacker-net48.exe / UnpackerGui.exe / worker/ / worker/modern/ / licenses/
      # 注意 modern 后端必须放在 worker\modern —— RecoveryPipeline 跑在 worker 进程里，
      # 是以 worker 的 BaseDirectory 去找 modern\Unpacker.ModernWorker.exe 的。
      - name: 组装发布目录
        run: |
          $ver = (Select-String -Path src/Unpacker.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $out = 'src\bin\Release\net48'
          $modern = 'src\ModernWorker\bin\Release\net8.0-windows'
          $gui = 'src\Gui\bin\Release\net48'
          $stage = "EazUnpacker-v$ver-net48-Release"

          New-Item -ItemType Directory -Path "$out\worker\modern" -Force | Out-Null
          Copy-Item "$modern\*" -Destination "$out\worker\modern" -Recurse -Force

          # 图形前端与主程序同目录：GUI 默认就在自己所在目录找 Unpacker-net48.exe
          Copy-Item "$gui\UnpackerGui.exe", "$gui\UnpackerGui.exe.config" -Destination $out -Force

          # 主程序改名，与上游发布包保持一致
          Rename-Item "$out\Unpacker.exe" 'Unpacker-net48.exe'
          Rename-Item "$out\Unpacker.exe.config" 'Unpacker-net48.exe.config'

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "$out\*" -Destination $stage -Recurse -Force

          # 上游发布包不含调试符号和 XML 文档
          Get-ChildItem $stage -Recurse -Include *.pdb, *.xml | Remove-Item -Force

          Copy-Item LICENSE, NOTICE, README.md -Destination $stage -Force
          New-Item -ItemType Directory -Path "$stage\licenses" | Out-Null
          Copy-Item 'src\ThirdParty\EazFixer\LICENSE' "$stage\licenses\EazFixer-LICENSE"
          Copy-Item 'src\ThirdParty\EazyDevirt\LICENSE' "$stage\licenses\EazyDevirt-LICENSE"
          Copy-Item 'src\ThirdParty\Echo\LICENSE.md' "$stage\licenses\Echo-LICENSE.md"

          foreach ($f in 'Unpacker-net48.exe', 'UnpackerGui.exe', 'worker\Unpacker.Worker.exe',
                         'worker\modern\Unpacker.ModernWorker.exe',
                         'licenses\EazFixer-LICENSE', 'LICENSE') {
            if (-not (Test-Path "$stage\$f")) { throw "发布目录缺少 $f" }
          }
          Get-ChildItem $stage | Select-Object Name

      - name: 打包
        id: pack
        run: |
          $ver = (Select-String -Path src/Unpacker.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $stage = "EazUnpacker-v$ver-net48-Release"
          $name = "$stage.zip"
          Remove-Item $name -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath $name
          "version=$ver" >> $env:GITHUB_OUTPUT
          "zip=$name" >> $env:GITHUB_OUTPUT
          Get-Item $name | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
          VER: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VER}-$(date -u +%m%d)"
            # 同一天多次构建：tag 已存在就追加序号
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              n=2
              while gh release view "${TAG}-${n}" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
                n=$((n + 1))
              done
              TAG="${TAG}-${n}"
            fi
          fi

          {
            echo "自动构建产物，基于提交 \`${GITHUB_SHA::7}\`。"
            echo
            echo "解压后运行 \`Unpacker-net48.exe\`。现代后端需要 .NET 8 Desktop Runtime，已内置在 \`worker/modern/\`。"
            echo
            echo "图形界面：双击 \`UnpackerGui.exe\`（需与 \`Unpacker-net48.exe\`、\`worker/\` 放在同一目录）。"
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            printf '| `%s` | %s |\n' "$ZIP" "$(du -h "$ZIP" | cut -f1)"
          } > notes.md

          ARGS=(--target "$GITHUB_SHA" --title "EazUnpacker ${TAG}" --notes-file notes.md)
          if [ "$DRAFT" = "true" ]; then
            ARGS+=(--draft)
          else
            ARGS+=(--latest)
          fi

          gh release create "$TAG" "${ARGS[@]}" "$ZIP"
          echo "::notice title=Release 已创建::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
